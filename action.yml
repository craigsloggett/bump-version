name: Bump Version

description: Rewrites a pinned version string in a file, by yq path for YAML or by keyed line otherwise.

inputs:
  file:
    description: Path to the file to edit.
    required: true
  key:
    description: A yq path expression for YAML files, or the token that begins the version line otherwise.
    required: true
  version:
    description: The new version string to write.
    required: true
  summary-file:
    description: Filename of the job-scoped changed-files list written under `RUNNER_TEMP`.
    required: false
    default: changed-files.md

outputs:
  changed:
    description: Whether the file was modified. `false` if it already held the version.
    value: ${{ steps.bump.outputs.changed }}
  file:
    description: The path to the file that was edited.
    value: ${{ steps.bump.outputs.file }}

runs:
  using: composite
  steps:
    - name: Bump Version
      id: bump
      run: ${{ github.action_path }}/src/bump_version.sh
      shell: sh
      env:
        INPUT_FILE: ${{ inputs.file }}
        INPUT_KEY: ${{ inputs.key }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_SUMMARY_FILE: ${{ inputs.summary-file }}
